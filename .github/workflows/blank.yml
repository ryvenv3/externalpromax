name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Show Xcode version
      run: xcodebuild -version
      
    - name: Build .app (unsigned)
      run: |
        xcodebuild \
          -project 3105-1.1.1/ThreeOneOSFive.xcodeproj \
          -scheme 3105 \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO
      
    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -R build/Build/Products/Release-iphoneos/*.app Payload/
        zip -r external1.ipa Payload
      
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: external1-unsigned-ipa
        path: external1.ipa
